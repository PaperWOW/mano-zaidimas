<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mano Minecraft</title>
	
<style>
body {
    margin: 0;
	background: skyblue;
	overflow: hidden;
}

#world {
    position: absolute;
	width: 100%;
	height: 100%;
	perspective: 600px;
}

.ground {
    position: absolute;
	width: 500px;
	height: 500px;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%) rotateX(60deg);
	background: green;
	border: 4px solid darkgreen;
}

.block {
    position: absolute;
	width: 60px;
	height: 60px;
	background: green;
	border: 2px solid darkgreen;
}

#player {
    position: absolute;
	width: 30px;
	height: 50px;
	background: blue;
	left: 50%;
	top: 50%;
}

#world {
    display: none;
}

#playButton {
  display: block;
  margin: 300px auto;
  width: 300px;
  height: 100px;
  font-size: 36px;
}

</style>
</head>

<body>

<button id="play">Žaisti</button>

<div id="world">
    <div class="ground"></div>
	<div id="player"></div>
</div>

<script>

document.getElementById("play").onclick = function() {
    document.getElementById("play").style.display = "none";
	document.getElementById("world").style.display = "block";
};

var player = document.getElementById("player");

var x = 50;
var y = 50;

document.onkeydown = function(e) {
    e = e || window.event;
	
	if (e.keyCode == 37) x -= 2;
	if (e.keyCode == 39) x += 2;
	if (e.keyCode == 38) y -= 2;
	if (e.keyCode == 40) y += 2;
	
	player.style.left = x + "%";
	player.style.top = y + "%";
};
</script>

</body>
</html>
